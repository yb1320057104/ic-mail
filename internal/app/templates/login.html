<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 - Privacy Mail</title>
<style>
:root{--ink:#10233f;--muted:#64748b;--brand:#0f9f8f;--line:#dce7e5;--danger:#b91c1c}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 10%,#ccfbf1 0,transparent 30%),linear-gradient(145deg,#f8fafc,#edf7f5)}.page{width:min(1040px,calc(100% - 32px));display:grid;grid-template-columns:1.08fr .92fr;background:#fff;border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 30px 90px rgba(15,71,67,.14)}.intro{padding:58px;background:linear-gradient(145deg,#083344,#0f766e);color:#fff;display:flex;flex-direction:column;justify-content:center}.intro small{letter-spacing:.18em;font-weight:900;color:#99f6e4}.intro h1{font-size:44px;line-height:1.08;margin:16px 0}.intro p{color:#ccfbf1;line-height:1.8}.card{padding:46px}.card h2{font-size:28px;margin:0 0 8px}.sub{color:var(--muted);margin-bottom:28px}.field{display:block;margin:16px 0;color:#475569;font-size:13px;font-weight:800}.field input{display:block;width:100%;margin-top:7px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;outline:0}.field input:focus{border-color:#2dd4bf;box-shadow:0 0 0 4px #ccfbf1}.captcha{display:grid;grid-template-columns:1fr 180px;gap:10px;align-items:end}.captcha img{width:180px;height:54px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:#effaf8}.primary{width:100%;border:0;border-radius:12px;padding:14px;background:linear-gradient(135deg,#0f9f8f,#14b8a6);color:#fff;font-weight:900;cursor:pointer;margin-top:8px}.primary:disabled{opacity:.6}.foot{text-align:center;color:var(--muted);margin-top:22px}.foot a{color:var(--brand);font-weight:900;text-decoration:none}.notice{margin-top:16px;padding:12px;border-radius:10px;background:#ecfdf5;color:#047857}.notice.err{background:#fef2f2;color:var(--danger)}.notice[hidden]{display:none}@media(max-width:760px){.page{grid-template-columns:1fr}.intro{padding:30px}.intro h1{font-size:30px}.card{padding:28px}.captcha{grid-template-columns:1fr 140px}.captcha img{width:140px}}
</style></head><body><main class="page"><section class="intro"><small>ICLOUD PRIVACY MAIL</small><h1>安全登录<br>邮箱管理平台</h1><p>统一管理 Apple 账号、隐私邮箱、验证码和注册邀请。连续 5 次密码错误将锁定 10 分钟。</p></section><section class="card"><h2>登录账号</h2><div class="sub">登录后进入你的专属邮箱工作台</div><label class="field">用户名<input id="username" autocomplete="username" autofocus></label><label class="field">密码<input id="password" type="password" autocomplete="current-password"></label><div class="captcha"><label class="field">图形验证码<input id="captchaCode" autocomplete="off" maxlength="5" placeholder="输入右侧字符"></label><img id="captchaImage" alt="图形验证码" title="点击刷新" onclick="loadCaptcha()"></div><button class="primary" id="submit" onclick="login()">安全登录</button><div class="notice" id="notice" hidden></div><div class="foot">还没有账号？ <a id="registerLink" href="/register">前往注册</a></div></section></main>
<script>
const $=id=>document.getElementById(id);let captchaID='';function notice(t,e=false){$('notice').textContent=t;$('notice').classList.toggle('err',e);$('notice').hidden=!t}async function loadCaptcha(){try{const r=await fetch('/api/auth/captcha',{cache:'no-store'}),d=await r.json();if(!d.enabled){$('captchaImage').hidden=true;$('captchaCode').closest('.captcha').hidden=true;captchaID='';return}captchaID=d.captcha_id;$('captchaImage').src=d.image_url+'?t='+Date.now();$('captchaCode').value=''}catch(e){notice('验证码加载失败，请刷新页面',true)}}async function login(){const username=$('username').value.trim(),password=$('password').value,captcha_code=$('captchaCode').value.trim().toUpperCase();if(!username||!password||(!captchaID?false:!captcha_code)){notice('请完整填写用户名、密码和验证码',true);return}$('submit').disabled=true;try{const r=await fetch('/api/auth/login',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({username,password,captcha_id:captchaID,captcha_code})}),d=await r.json();if(!d.success){if(r.status===429){const sec=Number(r.headers.get('Retry-After')||600);throw new Error(`登录已锁定，请在 ${Math.ceil(sec/60)} 分钟后重试`)}throw new Error(d.message||'登录失败')}location.href='/'}catch(e){notice(e.message,true);await loadCaptcha()}finally{$('submit').disabled=false}}document.addEventListener('keydown',e=>{if(e.key==='Enter')login()});fetch('/api/auth/me',{credentials:'same-origin'}).then(r=>r.json()).then(d=>{if(d.authenticated)location.href='/';if(!d.registration_enabled)$('registerLink').title='注册需要管理员开放或提供邀请码'});loadCaptcha();
</script></body></html>
