<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>兑换隐私邮箱</title><style>
:root{color-scheme:dark;--bg:#020817;--panel:#071a37;--line:#173d70;--text:#eef6ff;--muted:#93acd0}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,"Microsoft YaHei",sans-serif;background:radial-gradient(circle at 20% 0,#0b2b5c 0,transparent 38%),var(--bg);color:var(--text);display:grid;place-items:center;padding:24px}.box{width:min(720px,100%);background:linear-gradient(145deg,rgba(10,35,73,.97),rgba(3,15,35,.98));border:1px solid var(--line);box-shadow:0 28px 80px #0009;padding:32px}.eyebrow{color:#60a5fa;letter-spacing:.12em}.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:24px 0}.stat{background:#06152e;border:1px solid var(--line);padding:20px}.stat strong{font-size:30px;display:block}.stat span,p{color:var(--muted)}label{display:grid;gap:8px;margin:14px 0}textarea,select,button{min-height:46px;border:1px solid var(--line);border-radius:5px;background:#04132c;color:var(--text);padding:0 14px;font:inherit}textarea{min-height:130px;padding:12px 14px;resize:vertical;line-height:1.6}button{background:linear-gradient(135deg,#1d4ed8,#2563eb);font-weight:700;cursor:pointer;width:100%}button:disabled{opacity:.55;cursor:wait}.guide{margin:18px 0;border:1px solid var(--line);background:#04132c}.guide summary{padding:13px 15px;color:#93c5fd;font-weight:800;cursor:pointer}.guide div{padding:0 18px 15px;color:var(--muted);line-height:1.7}.guide ol{margin:0;padding-left:22px}.guide li{margin:7px 0}.result{display:none;margin-top:18px;background:#020b1c;border:1px solid var(--line);padding:16px;white-space:pre-wrap;word-break:break-all;max-height:300px;overflow:auto}.actions{display:none;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}@media(max-width:560px){.box{padding:22px}.stats,.actions{grid-template-columns:1fr}}
</style></head><body><main class="box"><div class="eyebrow">ICLOUD PRIVACY MAIL</div><h1>兑换隐私邮箱</h1><p>支持一次粘贴多个兑换码，每行一个，也可以用逗号或空格分隔。整批校验通过后才会统一发放。</p><details class="guide"><summary>查看兑换使用教学</summary><div><ol><li>把一个或多个兑换码粘贴到输入框，每行一个，也支持空格或逗号分隔。</li><li>选择 JSON 取码、邮件可视化或邮件内容地址格式。</li><li>点击“批量兑换”，整批兑换码全部有效时才会统一发放。</li><li>成功后立即复制结果或下载 TXT 文件并妥善保存。</li></ol><p>兑换码通常只能使用一次。请勿把兑换码或取码地址发送到公开群聊；失败时请核对是否输入了已使用、失效或不属于当前兑换池的兑换码。</p></div></details><section class="stats"><div class="stat"><strong id="stock">-</strong><span>当前可兑换邮箱</span></div><div class="stat"><strong id="redeemed">-</strong><span>累计已兑换邮箱</span></div></section><label>兑换码（最多100个）<textarea id="code" autocomplete="off" placeholder="每行输入一个兑换码&#10;MAIL-XXXX&#10;MAIL-YYYY"></textarea></label><label>导出方式<select id="apiType"><option value="json">邮箱号----JSON 取码地址</option><option value="visual">邮箱号----邮件可视化取码地址</option><option value="content">邮箱号----邮件内容取码地址</option></select></label><button id="submit" onclick="redeem()">批量兑换</button><div id="result" class="result"></div><div id="actions" class="actions"><button onclick="copyResult()">复制全部</button><button onclick="downloadResult()">下载 TXT</button></div></main><script>
const token=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'');let resultText='';async function call(path,options){const r=await fetch(path,options);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.message||d.error||`请求失败 (${r.status})`);return d}async function load(){try{const d=await call(`/api/public/redemption-pools/${encodeURIComponent(token)}`);stock.textContent=d.stock;redeemed.textContent=d.redeemed}catch(e){showResult(e.message)}}function showResult(text){const el=document.getElementById('result');el.style.display='block';el.textContent=text}async function redeem(){const b=document.getElementById('submit');b.disabled=true;b.textContent='正在批量兑换…';try{const raw=document.getElementById('code').value.trim();const d=await call(`/api/public/redemption-pools/${encodeURIComponent(token)}/redeem`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:raw,api_type:document.getElementById('apiType').value})});resultText=(d.lines||[]).join('\n');showResult(`成功兑换 ${d.code_count||0} 个兑换码，共 ${d.quantity||0} 个邮箱\n\n${resultText}`);document.getElementById('actions').style.display='grid';await load()}catch(e){showResult(e.message)}finally{b.disabled=false;b.textContent='批量兑换'}}async function copyResult(){await navigator.clipboard.writeText(resultText)}function downloadResult(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([resultText+'\n'],{type:'text/plain;charset=utf-8'}));a.download='隐私邮箱批量兑换结果.txt';a.click();URL.revokeObjectURL(a.href)}load();
</script></body></html>
