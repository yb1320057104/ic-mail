<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>兑换隐私邮箱</title><style>
:root{color-scheme:dark;--bg:#020817;--panel:#071a37;--line:#173d70;--text:#eef6ff;--muted:#93acd0}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,"Microsoft YaHei",sans-serif;background:radial-gradient(circle at 20% 0,#0b2b5c 0,transparent 38%),var(--bg);color:var(--text);display:grid;place-items:center;padding:24px}.box{width:min(760px,100%);background:linear-gradient(145deg,rgba(10,35,73,.97),rgba(3,15,35,.98));border:1px solid var(--line);box-shadow:0 28px 80px #0009;padding:32px}.eyebrow{color:#60a5fa;letter-spacing:.12em}.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:24px 0}.stat{background:#06152e;border:1px solid var(--line);padding:20px}.stat strong{font-size:30px;display:block}.stat span,p{color:var(--muted)}label{display:grid;gap:8px;margin:14px 0}textarea,input,select,button{min-height:46px;border:1px solid var(--line);border-radius:5px;background:#04132c;color:var(--text);padding:0 14px;font:inherit}textarea{min-height:130px;padding:12px 14px;resize:vertical;line-height:1.6}button{background:linear-gradient(135deg,#1d4ed8,#2563eb);font-weight:700;cursor:pointer;width:100%}button.secondary{background:#071a37}button:disabled{opacity:.55;cursor:wait}.guide,.lookup{margin:18px 0;border:1px solid var(--line);background:#04132c;padding:14px}.guide summary{padding:0;color:#93c5fd;font-weight:800;cursor:pointer}.guide div{padding:12px 4px 0;color:var(--muted);line-height:1.7}.guide ol{margin:0;padding-left:22px}.guide li{margin:7px 0}.result{display:none;margin-top:18px;background:#020b1c;border:1px solid var(--line);padding:16px;white-space:pre-wrap;word-break:break-all;max-height:300px;overflow:auto}.actions{display:none;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}.lookup-row{display:grid;grid-template-columns:1fr auto;gap:10px}.lookup-row button{width:auto}@media(max-width:620px){.box{padding:22px}.stats,.actions,.lookup-row{grid-template-columns:1fr}.lookup-row button{width:100%}}
</style></head><body><main class="box"><div class="eyebrow">ICLOUD PRIVACY MAIL</div><h1>兑换隐私邮箱</h1><p>支持一次粘贴多个兑换码。请设置一个查单密码，以后可以用它查看历史兑换记录。</p><details class="guide"><summary>查看兑换使用教学</summary><div><ol><li>粘贴兑换码，每行一个。</li><li>选择 JSON、可视化或内容地址格式。</li><li>设置 4-64 位查单密码后批量兑换。</li><li>以后使用同一密码即可查询并切换三种导出格式。</li></ol></div></details><section class="stats"><div class="stat"><strong id="stock">-</strong><span>当前可兑换邮箱</span></div><div class="stat"><strong id="redeemed">-</strong><span>累计已兑换邮箱</span></div></section><label>兑换码（最多100个）<textarea id="code" autocomplete="off" placeholder="每行输入一个兑换码"></textarea></label><label>导出方式<select id="apiType"><option value="json">邮箱号----JSON 取码地址</option><option value="visual">邮箱号----邮件可视化地址</option><option value="content">邮箱号----邮件内容地址</option></select></label><label>查单密码<input id="lookupPassword" type="password" autocomplete="new-password" minlength="4" maxlength="64" placeholder="请记住此密码，后续查询需要"></label><button id="submit" onclick="redeem()">批量兑换</button><section class="lookup"><strong>历史兑换查单</strong><p>输入兑换时设置的密码，可按上方所选格式重新导出。</p><div class="lookup-row"><input id="historyPassword" type="password" autocomplete="current-password" placeholder="输入查单密码"><button class="secondary" onclick="lookup()">查看历史记录</button></div></section><div id="result" class="result"></div><div id="actions" class="actions"><button onclick="copyResult()">复制全部</button><button onclick="downloadResult()">下载 TXT</button><button onclick="changeFormat('visual')">转可视化地址</button><button onclick="changeFormat('content')">转内容地址</button></div></main><script>
const token=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'');
let resultText='';
async function call(path,options){const r=await fetch(path,options);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.message||d.error||`请求失败 (${r.status})`);return d}
async function load(){try{const d=await call(`/api/public/redemption-pools/${encodeURIComponent(token)}`);stock.textContent=d.stock;redeemed.textContent=d.redeemed}catch(e){showResult(e.message)}}
function showResult(text){const el=document.getElementById('result');el.style.display='block';el.textContent=text}
async function redeem(){const b=document.getElementById('submit'),password=document.getElementById('lookupPassword').value;if(password.length<4){showResult('请先设置至少 4 位查单密码');return}b.disabled=true;b.textContent='正在批量兑换…';try{const raw=document.getElementById('code').value.trim();const d=await call(`/api/public/redemption-pools/${encodeURIComponent(token)}/redeem`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:raw,api_type:document.getElementById('apiType').value,lookup_password:password})});resultText=(d.lines||[]).join('\n');document.getElementById('historyPassword').value=password;showResult(`成功兑换 ${d.code_count||0} 个兑换码，共 ${d.quantity||0} 个邮箱\n查单号：${d.order_id||'-'}\n\n${resultText}`);document.getElementById('actions').style.display='grid';await load()}catch(e){showResult(e.message)}finally{b.disabled=false;b.textContent='批量兑换'}}
async function lookup(options={}){const password=document.getElementById('historyPassword').value;const type=String(options.type||document.getElementById('apiType').value||'json');if(password.length<4){showResult('请输入至少 4 位查单密码');return false}const buttons=[...document.querySelectorAll('#actions button,.lookup-row button')];buttons.forEach(button=>button.disabled=true);showResult(`正在转换为${type==='visual'?'可视化地址':type==='content'?'邮件内容地址':'JSON 取码地址'}，请稍候…`);try{const d=await call(`/api/public/redemption-pools/${encodeURIComponent(token)}/orders`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password,api_type:type})});resultText=(d.lines||[]).join('\n');document.getElementById('apiType').value=type;showResult(`找到 ${(d.orders||[]).length} 笔记录，共 ${d.quantity||0} 个邮箱\n当前格式：${type==='visual'?'可视化地址':type==='content'?'邮件内容地址':'JSON 取码地址'}\n\n${resultText}`);document.getElementById('actions').style.display='grid';return true}catch(e){showResult(`转换失败：${e.message}`);return false}finally{buttons.forEach(button=>button.disabled=false)}}
async function changeFormat(type){await lookup({type})}
async function copyResult(){if(!resultText){showResult('没有可以复制的查单结果');return}await navigator.clipboard.writeText(resultText);showResult(`已复制当前格式的 ${resultText.split('\n').filter(Boolean).length} 条记录\n\n${resultText}`)}
function downloadResult(){if(!resultText){showResult('没有可以下载的查单结果');return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([resultText+'\n'],{type:'text/plain;charset=utf-8'}));a.download='隐私邮箱兑换历史.txt';a.click();URL.revokeObjectURL(a.href)}
load();
</script></body></html>
