<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>注册账号</title>
<style>
:root{color-scheme:dark;--ink:#eef6ff;--muted:#8eb0dd;--brand:#60a5fa;--line:rgba(59,130,246,.35)}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 0,rgba(29,78,216,.32),transparent 35%),linear-gradient(145deg,#00030a,#03122d)}.card{width:min(520px,calc(100% - 32px));padding:38px;border:1px solid var(--line);border-radius:24px;background:#04142f;box-shadow:0 25px 70px rgba(0,0,0,.5)}h1{margin:0 0 8px}.sub{margin-bottom:24px;color:var(--muted)}.field{display:block;margin:14px 0;color:#a9c7ed;font-size:13px;font-weight:800}.field input{display:block;width:100%;margin-top:7px;padding:13px;border:1px solid var(--line);border-radius:11px;background:#061a3b;color:#eef6ff;caret-color:#60a5fa;font:inherit}.field input:-webkit-autofill{-webkit-text-fill-color:#eef6ff;-webkit-box-shadow:0 0 0 1000px #061a3b inset}.primary,.qq-button{display:block;width:100%;padding:14px;border:0;border-radius:12px;color:#fff;text-align:center;font-weight:900;cursor:pointer}.primary{background:linear-gradient(135deg,#2563eb,#1d4ed8)}.qq-button{margin-top:12px;background:#0756a3}.notice{padding:12px;margin-top:15px;border-radius:10px;background:#35101a;color:#fda4af}.notice[hidden]{display:none}.foot{text-align:center;margin-top:20px;color:var(--muted)}a{color:var(--brand);font-weight:900;text-decoration:none}
</style></head><body><main class="card"><h1>创建平台账号</h1><div class="sub">注册页与登录页独立，账号归属和邀请来源会被清楚记录。</div><label class="field">用户名<input id="username" autocomplete="username"></label><label class="field">密码<input id="password" type="password" autocomplete="new-password" placeholder="至少 6 位"></label><label class="field">确认密码<input id="confirm" type="password" autocomplete="new-password"></label><label class="field" id="inviteWrap" hidden>管理员邀请码<input id="invite" autocomplete="off"></label><button class="primary" id="submit" onclick="register()">注册并登录</button><a class="qq-button" href="https://qm.qq.com/q/Zj2GlpHSsa" target="_blank" rel="noopener noreferrer">加入 QQ 群</a><div class="notice" id="notice" hidden></div><div class="foot">已有账号？ <a href="/login">返回登录</a></div></main>
<script>
const $=id=>document.getElementById(id);let required=false;function msg(t){$('notice').textContent=t;$('notice').hidden=!t}async function register(){const username=$('username').value.trim(),password=$('password').value,confirm=$('confirm').value,invite_code=$('invite').value.trim();if(!username||!password){msg('请填写用户名和密码');return}if(password!==confirm){msg('两次输入的密码不一致');return}if(required&&!invite_code){msg('请输入管理员邀请码');return}$('submit').disabled=true;try{const r=await fetch('/api/auth/register',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({username,password,invite_code})}),d=await r.json();if(!d.success)throw new Error(d.message||'注册失败');location.href='/'}catch(e){msg(e.message)}finally{$('submit').disabled=false}}fetch('/api/auth/me',{credentials:'same-origin'}).then(r=>r.json()).then(d=>{if(d.authenticated){location.href='/';return}if(!d.registration_enabled){msg('当前平台未开放注册，请联系管理员获取邀请码');$('submit').disabled=true}required=!!d.registration_invite_required;$('inviteWrap').hidden=!required;const q=new URLSearchParams(location.search).get('invite');if(q){$('invite').value=q;$('inviteWrap').hidden=false;required=true;history.replaceState({},'', '/register')}});
</script></body></html>
