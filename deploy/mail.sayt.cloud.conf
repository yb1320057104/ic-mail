server {
    listen 80;
    listen [::]:80;
    server_name mail.sayt.cloud;
    return 301 https://$host$request_uri;
}

# 兼容历史直连地址：http://120.79.140.114:8787/...
# 应用本身改到 127.0.0.1:8788，8787 只负责跳转正式域名。
server {
    listen 8787 default_server;
    listen [::]:8787 default_server;
    server_name _;
    return 308 https://mail.sayt.cloud$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mail.sayt.cloud;

    ssl_certificate /data/iCloud-Privacy-Mail/ssl/mail.sayt.cloud.pem;
    ssl_certificate_key /data/iCloud-Privacy-Mail/ssl/mail.sayt.cloud.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:mail_sayt_cloud_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 2m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
