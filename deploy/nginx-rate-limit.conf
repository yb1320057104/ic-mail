# Put the two limit_req_zone directives in nginx.conf's http {} block.
limit_req_zone $binary_remote_addr zone=ipm_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ipm_api:10m rate=10r/s;

server {
    listen 443 ssl http2;
    server_name example.com;

    # Configure ssl_certificate and ssl_certificate_key for your server.

    location = /api/auth/login {
        limit_req zone=ipm_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
        include proxy_params;
    }

    location = /api/auth/register {
        limit_req zone=ipm_auth burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
        include proxy_params;
    }

    location /api/v1/ {
        limit_req zone=ipm_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
        include proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        include proxy_params;
    }
}
